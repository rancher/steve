schemaID: pod
tests:
  - description: sort-by-restart-count-ascending-stable-first
    namespace: test-restarts
    query: sort=metadata.fields[3][0]
    expect:
      - name: stable-pod
      - name: restarting-pod

  - description: sort-by-restart-count-descending-restarting-first
    namespace: test-restarts
    query: sort=-metadata.fields[3][0]
    expect:
      - name: restarting-pod
      - name: stable-pod

  - description: sort-by-restart-field-without-sub-index-defaults-to-count-ascending
    namespace: test-restarts
    query: sort=metadata.fields[3]
    expect:
      - name: stable-pod
      - name: restarting-pod

  - description: filter-pods-with-zero-restarts
    namespace: test-restarts
    query: filter=metadata.fields[3][0]=0
    expect:
      - name: stable-pod

  - description: filter-pods-with-restarts-greater-than-zero
    namespace: test-restarts
    query: filter=metadata.fields[3][0]>0
    expect:
      - name: restarting-pod

# Timestamps are reported as <number><units>
# so a timestamp like "5m" (5 minutes ago)
# "feels" like it's less than an older object with a time like "1h" (1 hour ago)
  - description: sort-by-restart-timestamp-ascending-restarting-first
    namespace: test-restarts
    query: sort=metadata.fields[3][1]
    expect:
      - name: restarting-pod
      - name: stable-pod

  - description: sort-by-restart-timestamp-descending-stable-first
    namespace: test-restarts
    query: sort=-metadata.fields[3][1]
    expect:
      - name: stable-pod
      - name: restarting-pod

  - description: list-all-pods-in-namespace
    namespace: test-restarts
    query: ""
    expect:
      - name: restarting-pod
      - name: stable-pod


