schemaID: cert-manager.io.certificates
tests:
- description: "spec.dnsNames contains penne"
  query: "filter=spec.dnsNames+CONTAINS+penne"
  expected:
  - default/brie
  - default/camembert
- description: "spec.renewalTime before X"
  query: "filter=spec.dnsNames+CONTAINS+orzo"
  expected:
  - default/feta
