schemaID: secrets
namespace: sqlcache-secrets-test
tests:
- name: sorts by name
  query: sort=metadata.name&filter=metadata.labels.test-label=secrets-test
  expectedNames:
  - benin
  - eritrea
  - kenya
  - morocco
- name: sorts by project label
  query: sort=metadata.labels[management.cattle.io/project-scoped-secret],metadata.name&filter=metadata.labels.test-label=secrets-test
  expectedNames:
  - eritrea
  - kenya
  - benin
  - morocco
---
apiVersion: v1
kind: Namespace
metadata:
  name: sqlcache-secrets-test
---
apiVersion: v1
kind: Secret
metadata:
  name: morocco
  namespace: sqlcache-secrets-test
  labels:
    test-label: secrets-test
    management.cattle.io/project-scoped-secret: rabat
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: eritrea
  namespace: sqlcache-secrets-test
  labels:
    test-label: secrets-test
    management.cattle.io/project-scoped-secret: asmara
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: kenya
  namespace: sqlcache-secrets-test
  labels:
    test-label: secrets-test
    management.cattle.io/project-scoped-secret: nairobi
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: benin
  namespace: sqlcache-secrets-test
  labels:
    test-label: secrets-test
    management.cattle.io/project-scoped-secret: portonovo
type: Opaque
